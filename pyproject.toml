[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vellum"
version = "0.1.0"
description = "Always-on AI controller agent for SMB finance teams."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "structlog",
  "groq",
  "slack-bolt",
  "aiohttp",
  "langgraph",
  "langchain-core",
  "plaid-python",
  "stripe",
  "google-api-python-client",
  "google-auth-oauthlib",
  "sentence-transformers",
  "chromadb",
  "apscheduler",
  "httpx",
  "aiosqlite",
  "python-multipart",
  "sqlite-utils",
  "rapidfuzz",
  "reportlab",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["vellum"]
